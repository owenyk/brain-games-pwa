<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>数独游戏</title>

<script src="https://unpkg.com/vue@3.3.4/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.20/dist/sweetalert2.all.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  min-height: 100vh;
  background-color: #0F172A;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #fff;
  overflow-x: hidden;
}
#app {
  width: 100%;
  padding: 12px;
}

.card {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 12px;
  background-color: #1E293B;
  border-radius: 12px;
  padding: 16px;
}
.title-card {
  text-align: center;
}
.title-card h1 {
  padding: 8px 20px;
  background: rgba(15,23,42,.9);
  border-radius: 20px;
  color: #7dd3fc;
  font-size: 16px;
  font-weight: bold;
  border: 1px solid rgba(125,211,252,.2);
}
.time-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.time-text {
  font-size: 24px;
  font-weight: 700;
  color: #93C5FD;
}

.board-container {
  width: 100%;
  aspect-ratio: 1/1;
}
.sudoku-board {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(9,1fr);
  grid-template-rows: repeat(9,1fr);
  border: 4px solid #64748B;
  border-radius: 8px;
  overflow: hidden;
}
.cell {
  width: 100%;
  height: 100%;
  border: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1rem,4vw,1.5rem);
  font-weight: 700;
  cursor: pointer;
  background: #1E293B;
  position: relative;
}
.cell:nth-child(3n),
.cell:nth-child(6n) {
  border-right-width: 3px;
}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom-width: 3px;
}
.cell.fixed { color: #94A3B8; }
.cell.user { color: #fff; }
.cell.error {
  animation: errorBlink 1s infinite;
  background: #7F1D1D;
}
.cell.selected { background: #0369A1; z-index: 2; }
.cell.highlight { background: #334155; }

.note-grid,
.ans-preview {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  font-size: .5rem;
}
.note-grid { color: #94A3B8; }
.ans-preview { color: #22D3EE; z-index: 3; }

.btn-group, .btn-row2, .btn-row3 {
  display: grid;
  gap: 8px;
  margin-bottom: 10px;
}
.btn-group { grid-template-columns: repeat(5,1fr); }
.btn-row2 { grid-template-columns: repeat(3,1fr); }
.btn-row3 { grid-template-columns: repeat(4,1fr); }

.btn {
  padding: 12px 0;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.btn-num { background: #334155; color: #fff; }
.btn-primary { background: #16A34A; color: #fff; }
.btn-secondary { background: #2563EB; color: #fff; }
.btn-warning { background: #F59E0B; color: #fff; }
.btn-danger { background: #DC2626; color: #fff; }
.btn-print { background: #2563EB; color: #fff; }
.btn-answer { background: #16A34A; color: #fff; }

.switch-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 14px;
  background: #334155;
  border-radius: 8px;
  padding: 12px 0;
}
.switch-item input { width: 16px; height: 16px; }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 12px;
}
.modal-card {
  width: 100%;
  max-width: 420px;
  background: #1E293B;
  border-radius: 12px;
  padding: 16px;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.record-list { flex: 1; overflow-y: auto; }
.record-item {
  padding: 12px;
  border-bottom: 1px solid #334155;
  border-radius: 6px;
  margin-bottom: 8px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
}
.record-item:hover { background: #334155; }

@keyframes errorBlink {
  0%,100%{background:#7F1D1D;}
  50%{background:#991B1B;}
}

@media print {
  body * { visibility: hidden; }
  .board-container, .board-container * { visibility: visible; }
  .ans-preview { display: none !important; }
  .btn-group, .btn-row2, .btn-row3, .switch-item, .card:not(.board-container) {
    display: none !important;
  }
}
</style>
</head>

<body>

<!-- 顶部导航 -->
<div id="game-nav" style="position:fixed;top:10px;left:15px;right:25px;z-index:1000;display:flex;justify-content:space-between;pointer-events:none">
  <a href="index.html" style="pointer-events:auto;text-decoration:none;padding:6px 12px;background:rgba(15,23,42,.9);border-radius:20px;color:#94a3b8;border:1px solid rgba(125,211,252,.2)">← 主页</a>
  <a href="klotski-v3.html" style="pointer-events:auto;text-decoration:none;padding:6px 12px;background:rgba(15,23,42,.9);border-radius:20px;color:#94a3b8;border:1px solid rgba(125,211,252,.2)">华容道 →</a>
</div>

<div id="app">
  <div class="card title-card">
    <h1>数独游戏</h1>
    <p>逻辑思维与观察力训练</p>
  </div>

  <div class="card time-card">
    <span class="time-text">{{ timeDisplay }}</span>
    <span class="time-text">错误: {{ errorCount }}</span>
  </div>

  <div class="card board-container">
    <div class="sudoku-board">
      <div
        v-for="(cell, index) in boardFlatList"
        :key="index"
        :class="['cell',
          { fixed: cell.fixed, user: !cell.fixed, error: cell.error, selected: index===selectedCellIndex, highlight: isCellHighlight(index) }
        ]"
        @click="selectCell(index)"
      >
        <div v-if="cell.showHint||cell.showAnswerPreview" class="ans-preview">
          <span v-for="n in 9">{{ n===(cell.showHint?cell.hintNum:cell.answerNum)?n:'' }}</span>
        </div>
        <div v-else-if="cell.noteMode" class="note-grid">
          <span v-for="n in 9">{{ cell.notes.includes(n)?n:'' }}</span>
        </div>
        <span v-else>{{ cell.value||'' }}</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="btn-group">
      <button v-for="n in 9" class="btn btn-num" @click="inputNumber(n)">{{n}}</button>
      <button class="btn btn-num" @click="toggleNoteMode">笔记</button>
    </div>

    <div class="btn-group">
      <select v-model="difficulty" class="btn btn-num" @change="restartNewGame">
        <option value="easy">简单</option>
        <option value="normal">标准</option>
        <option value="hard">困难</option>
        <option value="expert">专家</option>
      </select>
      <button class="btn" :class="gameStart?(isPause?'btn-secondary':'btn-warning'):'btn-primary'" @click="toggleGameStart">
        {{ gameStart?(isPause?'继续':'暂停'):'开始' }}
      </button>
      <button class="btn btn-num" @click="eraseCell">擦除</button>
      <button class="btn btn-num" @click="getHint">提示</button>
      <button class="btn btn-num" @click="openRecordModal">记录</button>
    </div>

    <div class="btn-row2">
      <button class="btn btn-num" @click="clearAllUserInput">一键清除</button>
      <button class="btn btn-num" @click="clearAllNote">清笔记</button>
      <button class="btn btn-danger" @click="restartNewGame">新局</button>
    </div>

    <div class="btn-row3">
      <button class="btn btn-print" @click="printGameBoard">打印</button>
      <button class="btn btn-answer" @click="toggleGlobalAnswerPreview">显示答案</button>
      <label class="switch-item"><input type="checkbox" v-model="enableRealTimeCheck"> 实时检查</label>
      <label class="switch-item"><input type="checkbox" v-model="enableAutoHighlight"> 自动高亮</label>
    </div>
  </div>

  <!-- 记录弹窗 -->
  <div v-if="showRecordModal" class="modal" @click.self="closeRecordModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>游戏记录</h2>
        <div style="display:flex;gap:8px">
          <button class="btn btn-danger" @click="clearAllGameRecord">清空</button>
          <button class="btn btn-num" @click="closeRecordModal">关闭</button>
        </div>
      </div>
      <div class="filter-row">
        <select v-model="filterDiff"><option value="all">全部难度</option><option value="easy">简单</option><option value="normal">标准</option><option value="hard">困难</option><option value="expert">专家</option></select>
        <select v-model="filterSort"><option value="latest">最近10条</option><option value="fastest">用时前五</option></select>
      </div>
      <div class="record-list">
        <div v-if="filteredRecords.length===0" style="text-align:center;color:#94A3B8;padding:30px">暂无记录</div>
        <div v-for="(r,i) in filteredRecords" :key="i" class="record-item" @click="restoreGameFromRecord(r)">
          <div>
            <div>{{ r.diffText }}</div>
            <div style="font-size:18px;font-weight:700">{{ r.playTime }}</div>
            <div style="font-size:11px;color:#64748B">{{ r.saveDate }}</div>
          </div>
          <button class="record-del-btn" @click.stop="deleteGameRecord(i)">删除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, computed, watch } = Vue;

createApp({
setup() {
  /* ===== 计时 ===== */
  const totalSeconds = ref(0);
  let timer = null;
  const timeDisplay = computed(()=>{
    const m=String(Math.floor(totalSeconds.value/60)).padStart(2,'0');
    const s=String(totalSeconds.value%60).padStart(2,'0');
    return `${m}:${s}`;
  });
  const startTimer=()=>{ if(timer)clearInterval(timer); timer=setInterval(()=>totalSeconds.value++,1000); };
  const stopTimer=()=>clearInterval(timer);
  const resetTimer=()=>{ stopTimer(); totalSeconds.value=0; };

  /* ===== 状态 ===== */
  const difficulty=ref('normal');
  const gameStart=ref(false);
  const isPause=ref(false);
  const selectedCellIndex=ref(-1);
  const errorCount=ref(0);
  const enableRealTimeCheck=ref(true);
  const enableAutoHighlight=ref(true);
  const noteMode=ref(false);
  const globalAnswerPreview=ref(false);

  const board=ref([]);
  const answer=ref([]);
  const boardFlatList=computed(()=>board.value.flat());

  /* ===== 数独生成 ===== */
  function generateSudoku(){
    const g=Array.from({length:9},()=>Array(9).fill(0));
    function shuffle(arr){ return arr.sort(()=>Math.random()-0.5); }
    function canPlace(r,c,n){
      for(let i=0;i<9;i++) if(g[r][i]===n||g[i][c]===n) return false;
      const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
      for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(g[br+i][bc+j]===n) return false;
      return true;
    }
    function fill(r=0,c=0){
      if(r===9) return true;
      if(c===9) return fill(r+1,0);
      if(g[r][c]!==0) return fill(r,c+1);
      for(const n of shuffle([1,2,3,4,5,6,7,8,9])){
        if(canPlace(r,c,n)){
          g[r][c]=n;
          if(fill(r,c+1)) return true;
          g[r][c]=0;
        }
      }
      return false;
    }
    fill();
    return g;
  }

  function dig(board,count){
    const set=new Set();
    while(set.size<count){
      const r=Math.floor(Math.random()*9);
      const c=Math.floor(Math.random()*9);
      const key=`${r},${c}`;
      if(!set.has(key)){ set.add(key); board[r][c]=0; }
    }
  }

  function initGame(){
    resetTimer();
    selectedCellIndex.value=-1;
    errorCount.value=0;
    globalAnswerPreview.value=false;
    gameStart.value=false;
    isPause.value=false;

    answer.value=generateSudoku();
    const puzzle=JSON.parse(JSON.stringify(answer.value));
    dig(puzzle,{easy:35,normal:45,hard:55,expert:60}[difficulty.value]);

    board.value=puzzle.map((row,r)=>
      row.map((v,c)=>({
        value:v,
        fixed:v!==0,
        notes:[],
        noteMode:false,
        error:false,
        showHint:false,
        hintNum:0,
        showAnswerPreview:false,
        answerNum:answer.value[r][c]
      }))
    );
  }

  /* ===== 玩法逻辑 ===== */
  const selectCell=i=>{ if(!gameStart.value||isPause.value)return; selectedCellIndex.value=i; };
  const isCellHighlight=i=>{
    if(!enableAutoHighlight.value||selectedCellIndex.value===-1) return false;
    const r1=Math.floor(i/9),c1=i%9;
    const r2=Math.floor(selectedCellIndex.value/9),c2=selectedCellIndex.value%9;
    return r1===r2||c1===c2;
  };

  const inputNumber=n=>{
    if(selectedCellIndex.value===-1) return;
    const r=Math.floor(selectedCellIndex.value/9),c=selectedCellIndex.value%9;
    const cell=board.value[r][c];
    if(cell.fixed) return;

    cell.showHint=false;
    if(noteMode.value){
      cell.notes.includes(n)?cell.notes=cell.notes.filter(x=>x!==n):cell.notes.push(n);
      cell.noteMode=true;
      cell.value=0;
    }else{
      cell.value=n;
      cell.noteMode=false;
      cell.notes=[];
      cell.error=enableRealTimeCheck.value&&n!==answer.value[r][c];
      recountError();
    }
    checkWin();
  };

  const eraseCell=()=>{
    if(selectedCellIndex.value===-1) return;
    const r=Math.floor(selectedCellIndex.value/9),c=selectedCellIndex.value%9;
    const cell=board.value[r][c];
    if(cell.fixed) return;
    cell.value=0; cell.notes=[]; cell.noteMode=false; cell.error=false; cell.showHint=false;
    recountError();
  };

  const toggleNoteMode=()=>noteMode.value=!noteMode.value;
  const getHint=()=>{
    if(selectedCellIndex.value===-1) return;
    const r=Math.floor(selectedCellIndex.value/9),c=selectedCellIndex.value%9;
    const cell=board.value[r][c];
    if(cell.fixed) return;
    cell.showHint=!cell.showHint;
    cell.hintNum=cell.showHint?answer.value[r][c]:0;
  };

  const clearAllUserInput=()=>{
    board.value.flat().forEach(c=>{ if(!c.fixed){ c.value=0; c.notes=[]; c.error=false; c.showHint=false; }});
    errorCount.value=0;
  };
  const clearAllNote=()=>board.value.flat().forEach(c=>{ c.notes=[]; c.noteMode=false; });

  const toggleGlobalAnswerPreview=()=>{
    if(!gameStart.value) return;
    globalAnswerPreview.value=!globalAnswerPreview.value;
    board.value.flat().forEach(c=>{ if(!c.fixed){ c.showAnswerPreview=globalAnswerPreview.value; c.answerNum=globalAnswerPreview.value?answer.value[Math.floor(board.value.indexOf(c)/9)][c%9]:0; }});
  };

  const recountError=()=>{
    errorCount.value=board.value.flat().filter(c=>c.error).length;
  };

  const checkWin=()=>{
    if(board.value.flat().some(c=>!c.fixed&&c.value===0)) return;
    let err=0;
    board.value.forEach((row,r)=>row.forEach((c,cc)=>{ c.error=c.value!==answer.value[r][cc]; if(c.error)err++; }));
    errorCount.value=err;
    if(err===0){
      stopTimer();
      gameStart.value=false;
      saveRecord();
      Swal.fire({icon:'success',title:'🎉 通关！',text:`用时 ${timeDisplay.value}`,background:'#1E293B',color:'#fff'});
    }
  };

  /* ===== 记录 ===== */
  const records=ref(JSON.parse(localStorage.getItem('sudoku-records')||'[]'));
  const showRecordModal=ref(false);
  const filterDiff=ref('all');
  const filterSort=ref('latest');

  const filteredRecords=computed(()=>{
    let list=[...records.value];
    if(filterDiff.value!=='all') list=list.filter(r=>r.difficulty===filterDiff.value);
    if(filterSort.value==='latest'){
      list.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
      list=list.slice(0,10);
    }else{
      list.sort((a,b)=>a.seconds-b.seconds);
      list=list.slice(0,5);
    }
    return list;
  });

  const saveRecord=()=>{
    const rec={
      difficulty:difficulty.value,
      diffText:{easy:'简单',normal:'标准',hard:'困难',expert:'专家'}[difficulty.value],
      playTime:timeDisplay.value,
      seconds:totalSeconds.value,
      saveDate:new Date().toLocaleString(),
      timestamp:Date.now()
    };
    records.value.unshift(rec);
    records.value=records.value.slice(0,20);
    localStorage.setItem('sudoku-records',JSON.stringify(records.value));
  };

  const restoreGameFromRecord=r=>{
    difficulty.value=r.difficulty;
    initGame();
    stopTimer();
    closeRecordModal();
  };

  const deleteGameRecord=i=>{
    const tar=filteredRecords.value[i];
    records.value=records.value.filter(x=>x.timestamp!==tar.timestamp);
    localStorage.setItem('sudoku-records',JSON.stringify(records.value));
  };

  const clearAllGameRecord=()=>{ records.value=[]; localStorage.removeItem('sudoku-records'); };

  /* ===== 监听 ===== */
  watch(enableRealTimeCheck,v=>{ if(!v) board.value.flat().forEach(c=>c.error=false); recountError(); });
  watch(difficulty,()=>{ resetTimer(); initGame(); });

  /* ===== 初始化 ===== */
  initGame();

  return {
    timeDisplay,
    difficulty,
    gameStart,
    isPause,
    noteMode,
    enableRealTimeCheck,
    enableAutoHighlight,
    errorCount,
    boardFlatList,
    selectedCellIndex,
    selectCell,
    isCellHighlight,
    inputNumber,
    eraseCell,
    toggleNoteMode,
    getHint,
    clearAllUserInput,
    clearAllNote,
    toggleGlobalAnswerPreview,
    restartNewGame:initGame,
    printGameBoard:()=>window.print(),
    toggleGameStart:()=>{
      if(!gameStart.value){ gameStart.value=true; startTimer(); }
      else { isPause.value=!isPause.value; isPause.value?stopTimer():startTimer(); }
    },
    showRecordModal,
    openRecordModal:()=>showRecordModal.value=true,
    closeRecordModal:()=>showRecordModal.value=false,
    filteredRecords,
    filterDiff,
    filterSort,
    deleteGameRecord,
    clearAllGameRecord,
    restoreGameFromRecord
  };
}
}).mount('#app');
</script>
</body>
</html>
